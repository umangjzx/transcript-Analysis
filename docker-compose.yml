version: "3.9"

# Use Google + Cloudflare DNS on all containers so they can resolve
# external hostnames (MongoDB Atlas *.mongodb.net etc.).
# Docker's built-in DNS sometimes fails for external domains.
x-dns: &dns
  dns:
    - 8.8.8.8
    - 1.1.1.1

services:
  # ── Backend (FastAPI) ───────────────────────────────────────────────────────
  # Background analysis jobs run in-process (TASK_BACKEND=thread, the default),
  # so there is no Redis, worker or beat container. In production the same jobs
  # arrive from Cloud Tasks / Cloud Scheduler — see CLOUD-TASKS-MIGRATION.md.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rmsi-backend
    restart: unless-stopped
    <<: *dns
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/reports
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
    # Healthcheck lets the frontend wait until FastAPI is actually ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./admin-next
      dockerfile: Dockerfile
    container_name: rmsi-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/progress
    # Wait for backend to pass its healthcheck before Next.js starts accepting requests
    depends_on:
      backend:
        condition: service_healthy

  # ── ClamAV (optional virus scanning) ───────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    container_name: rmsi-clamav
    restart: unless-stopped
    <<: *dns
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    profiles:
      - full  # Only starts with: docker compose --profile full up

  # ── Ollama (optional LLM summaries) ────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rmsi-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - full  # Only starts with: docker compose --profile full up

volumes:
  backend_uploads:
  backend_reports:
  backend_logs:
  model_cache:
  clamav_data:
  ollama_data:
